<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const W=1080,H=1080,FPS=30,DUR=5.0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let em=new Image(); em.src='../golden_dog_emblem.png';
let ready=false; em.onload=()=>ready=true;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sparks=[];(function(){const r=mulberry32(5);
  for(let i=0;i<26;i++)sparks.push({a:r()*6.283,rr:395+r()*130,ph:r()*6.283,sp:0.6+r()*1.2,s:1+r()*2});
})();
window.renderFrame=function(fi){
  const t=fi/FPS, lp=t/DUR*Math.PI*2; // loops cleanly
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#050303';ctx.fillRect(0,0,W,H);
  // deep red ambient
  let rg=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,620);
  rg.addColorStop(0,'rgba(120,18,14,0.35)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  // breathing halo
  const br=1+0.012*Math.sin(lp);
  let hg=ctx.createRadialGradient(W/2,H/2,330*br,W/2,H/2,470*br);
  hg.addColorStop(0,'rgba(255,190,90,'+(0.10+0.05*Math.sin(lp))+')');hg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);
  // medallion
  if(ready){
    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(br,br);
    const sz=760;
    ctx.drawImage(em,-sz/2,-sz/2,sz,sz);
    // specular sweep clipped to medallion circle — one pass per loop
    ctx.beginPath(); ctx.arc(0,0,sz*0.485,0,7); ctx.clip();
    const sx=-900+((t/DUR)%1)*1800;
    const grad=ctx.createLinearGradient(sx-160,-540,sx+160,540);
    grad.addColorStop(0,'rgba(255,255,240,0)');
    grad.addColorStop(0.5,'rgba(255,250,225,0.16)');
    grad.addColorStop(1,'rgba(255,255,240,0)');
    ctx.fillStyle=grad; ctx.fillRect(-sz/2,-sz/2,sz,sz);
    ctx.restore();
  }
  // orbiting sparks
  for(const s of sparks){
    const ang=s.a+lp*0.16*s.sp;
    const x=W/2+Math.cos(ang)*s.rr, y=H/2+Math.sin(ang)*s.rr*0.96;
    const a=Math.max(0,Math.sin(lp*s.sp*2+s.ph));
    if(a<0.2)continue;
    ctx.globalAlpha=a*0.8; ctx.strokeStyle='#ffe9b0'; ctx.lineWidth=1.1;
    const r1=s.s*2.6*a;
    ctx.beginPath();ctx.moveTo(x-r1,y);ctx.lineTo(x+r1,y);ctx.moveTo(x,y-r1);ctx.lineTo(x,y+r1);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // couplets, faint, flanking
  ctx.fillStyle='rgba(240,211,138,0.5)';
  ctx.font='500 30px "Songti SC", serif'; ctx.textAlign='center';
  const l='打狗人空手而归', r='持狗者坐等分金';
  for(let i=0;i<7;i++){
    ctx.fillText(l[i], 74, 260+i*88);
    ctx.fillText(r[i], W-74, 260+i*88);
  }
  // bottom mark
  ctx.fillStyle='rgba(240,225,190,0.55)'; ctx.font='400 20px Georgia, serif';
  ctx.fillText('真金不怕火炼 · real gold fears no fire', W/2, H-56);
  ctx.fillStyle='rgba(240,211,138,0.45)'; ctx.font='400 16px Georgia, serif';
  ctx.fillText('jingou.gold', W/2, H-28);
  return true;
}
</script></body></html>
