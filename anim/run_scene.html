<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#000}
  canvas{display:block}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,FPS=30,DUR=8.0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dogImg=new Image(); dogImg.src='../_v4_dog_alpha.png';
let ready=false; dogImg.onload=()=>ready=true;

// seeded rng
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---- gold ingot drawing ----
function ingot(x,y,w,h,glow){
  // trapezoid ingot, front face
  const s=w*0.12;
  ctx.save();
  // body
  let g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#f6d67a');g.addColorStop(0.35,'#d4a638');g.addColorStop(0.75,'#8a5f14');g.addColorStop(1,'#5c3d0a');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x+s,y); ctx.lineTo(x+w-s,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill();
  // top face
  let g2=ctx.createLinearGradient(x,y-h*0.32,x,y);
  g2.addColorStop(0,'#fff3c4');g2.addColorStop(1,'#e9c458');
  ctx.fillStyle=g2;
  ctx.beginPath();
  ctx.moveTo(x+s*1.7,y-h*0.32); ctx.lineTo(x+w-s*1.7,y-h*0.32); ctx.lineTo(x+w-s,y); ctx.lineTo(x+s,y); ctx.closePath(); ctx.fill();
  // glint
  if(glow>0){
    ctx.globalAlpha=glow*0.85;
    ctx.fillStyle='#fffbe8';
    ctx.beginPath(); ctx.ellipse(x+w*0.28,y-h*0.16,w*0.10,h*0.10,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// pile layout (deterministic)
const pile=[];
(function(){
  const r=mulberry32(88);
  const cx=1000, baseY=596, bw=112, bh=40;
  const rows=[6,5,4,3,2,1];
  for(let ri=0;ri<rows.length;ri++){
    const n=rows[ri];
    const rowW=n*(bw+6)-6;
    for(let i=0;i<n;i++){
      pile.push({x:cx-rowW/2+i*(bw+6), y:baseY-ri*(bh+9), w:bw, h:bh, ph:r()*6.28});
    }
  }
  // scattered loose ingots front
  pile.push({x:800,y:640,w:106,h:37,ph:r()*6.28});
  pile.push({x:1060,y:650,w:110,h:38,ph:r()*6.28});
  pile.push({x:920,y:655,w:104,h:36,ph:r()*6.28});
})();

// sparkles
const sparks=[];
(function(){const r=mulberry32(7);
  for(let i=0;i<46;i++)sparks.push({x:790+r()*400,y:300+r()*320,ph:r()*6.28,sp:0.5+r()*1.4,s:1+r()*2.4});
})();
// gold dust motes drifting whole scene
const motes=[];
(function(){const r=mulberry32(21);
  for(let i=0;i<60;i++)motes.push({x:r()*W,y:r()*H,vx:6+r()*16,ph:r()*6.28,s:0.6+r()*1.8});
})();

function easeOutCubic(u){return 1-Math.pow(1-u,3)}

// dog trajectory: bounding run from off-left, arrives at x=640 (center-left of pile) at t=5.6, then settles
function dogState(t){
  const arrive=5.6;
  let x,bob=0,rot=0,squash=1;
  const hopF=2.1; // hops per second
  if(t<arrive){
    const u=t/arrive;
    x=-340+easeOutCubic(u)*(660+340);
    const ph=t*hopF*Math.PI*2;
    const hop=Math.abs(Math.sin(ph));
    bob=-hop*54;
    rot=Math.cos(ph)*0.055;      // pitch with arc
    const land=Math.max(0,Math.sin(ph+Math.PI))* (Math.sin(ph)<0.12?1:0);
    squash=1-0.045*Math.pow(1-hop,3);
  } else {
    x=660+Math.min(1,(t-arrive))*8;
    const settle=Math.max(0,1-(t-arrive)*1.6);
    bob=-Math.abs(Math.sin(arrive*hopF*Math.PI*2))*54*settle;
    rot=0; squash=1;
    // gentle proud breathing
    squash=1+Math.sin((t-arrive)*2.2)*0.006;
  }
  return {x,bob,rot,squash};
}

window.renderFrame=function(fi){
  const t=fi/FPS;
  ctx.clearRect(0,0,W,H);
  // camera push-in
  const zoom=1+0.07*(t/DUR);
  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);

  // ---- background ----
  ctx.fillStyle='#070404'; ctx.fillRect(-80,-60,W+160,H+120);
  // red horizon glow behind pile
  let rg=ctx.createRadialGradient(920,560,60,920,560,620);
  rg.addColorStop(0,'rgba(140,20,16,0.55)');rg.addColorStop(0.5,'rgba(90,12,10,0.28)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(-80,-60,W+160,H+120);
  // warm gold aura above pile
  let ga=ctx.createRadialGradient(950,440,30,950,440,420);
  ga.addColorStop(0,'rgba(255,190,80,0.20)');ga.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ga; ctx.fillRect(-80,-60,W+160,H+120);
  // floor
  let fg=ctx.createLinearGradient(0,540,0,H);
  fg.addColorStop(0,'rgba(60,10,8,0.0)');fg.addColorStop(1,'rgba(120,26,18,0.35)');
  ctx.fillStyle=fg; ctx.fillRect(-80,540,W+160,H-540+60);

  // drifting motes (behind)
  for(const m of motes){
    const mx=((m.x + m.vx*t)%(W+40))-20;
    const my=m.y + Math.sin(t*0.8+m.ph)*12;
    ctx.globalAlpha=0.10+0.10*Math.sin(t*2+m.ph);
    ctx.fillStyle='#ffd98a';
    ctx.beginPath(); ctx.arc(mx,my,m.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ---- gold pile ----
  // pile ground shadow
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(985,668,330,34,0,0,7); ctx.fill();
  for(const b of pile){
    const glint=Math.max(0,Math.sin(t*1.8+b.ph));
    ingot(b.x,b.y,b.w,b.h,glint*glint);
  }
  // sparkles over pile
  for(const s of sparks){
    const a=Math.max(0,Math.sin(t*s.sp*2+s.ph));
    if(a<0.25)continue;
    ctx.globalAlpha=a*0.9;
    ctx.strokeStyle='#fff6d8'; ctx.lineWidth=1.1;
    const r1=s.s*3*a;
    ctx.beginPath();
    ctx.moveTo(s.x-r1,s.y);ctx.lineTo(s.x+r1,s.y);
    ctx.moveTo(s.x,s.y-r1);ctx.lineTo(s.x,s.y+r1);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // ---- dog ----
  if(ready){
    const st=dogState(t);
    const dh=330, dw=dh*(1827/1850);
    const gy=612; // ground line for paws
    ctx.save();
    // shadow
    const shy=1-Math.min(1,-st.bob/90);
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.ellipse(st.x, gy+34, dw*0.34*(0.7+0.3*shy), 16*(0.7+0.3*shy),0,0,7); ctx.fill();
    // motion streaks while running
    if(t<5.6){
      ctx.save();
      ctx.globalAlpha=0.09;
      for(let k=1;k<=3;k++){
        ctx.globalAlpha=0.08/k;
        ctx.drawImage(dogImg, st.x-dw/2 - k*26, gy-dh+st.bob + k*3, dw*st.squash, dh/st.squash);
      }
      ctx.restore();
    }
    ctx.translate(st.x, gy+st.bob);
    ctx.rotate(st.rot);
    ctx.scale(st.squash, 1/st.squash);
    ctx.drawImage(dogImg,-dw/2,-dh,dw,dh);
    ctx.restore();
    // warm rim light on dog as it nears gold
    const near=Math.min(1,Math.max(0,(st.x+200)/900));
    ctx.globalAlpha=near*0.10; ctx.fillStyle='#ffbb55';
    ctx.globalAlpha=1;
  }

  // arrival bloom
  const ta=t-5.6;
  if(ta>0&&ta<1.6){
    const a=Math.sin(Math.min(1,ta/1.6)*Math.PI);
    let bg2=ctx.createRadialGradient(830,470,10,830,470,520);
    bg2.addColorStop(0,'rgba(255,210,110,'+(0.16*a)+')');bg2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg2; ctx.fillRect(-80,-60,W+160,H+120);
  }

  ctx.restore(); // camera

  // vignette
  let vg=ctx.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.92);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // ---- typography (composited, never generated) ----
  // seal top-right, always
  ctx.save();
  ctx.translate(W-98,58);
  ctx.fillStyle='#a41e14';
  ctx.fillRect(-34,-34,68,68);
  ctx.strokeStyle='rgba(255,235,190,0.9)'; ctx.lineWidth=2; ctx.strokeRect(-28,-28,56,56);
  ctx.fillStyle='#f5e6c4'; ctx.font='700 26px "Songti SC", serif'; ctx.textAlign='center';
  ctx.fillText('金',0,-3); ctx.fillText('狗',0,24);
  ctx.restore();

  // closing text
  const tt=t-6.0;
  if(tt>0){
    const a=Math.min(1,tt/0.9);
    ctx.globalAlpha=a;
    ctx.textAlign='center';
    ctx.fillStyle='#f0d38a';
    ctx.font='500 34px "Songti SC", serif';
    ctx.fillText('持狗者坐等分金', 300, 300);
    ctx.fillStyle='rgba(240,225,190,0.85)';
    ctx.font='400 17px Georgia, serif';
    ctx.fillText('the holder sits, and the gold arrives', 300, 334);
    ctx.fillStyle='rgba(240,211,138,0.65)';
    ctx.font='400 15px Georgia, serif';
    ctx.fillText('🜚  jingou.gold', 300, 366);
    ctx.globalAlpha=1;
  }
  return true;
}
</script></body></html>
